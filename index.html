<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Générateur de QR Code</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --ink: #1c1b1a;
      --paper: #f6f3ee;
      --line: #d8d2c6;
      --accent: #2f5d50;
      --accent-soft: #e4ede9;
      --mono: 'IBM Plex Mono', 'Courier New', monospace;
      --serif: 'Georgia', 'Iowan Old Style', serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      background: var(--paper);
      color: var(--ink);

      font-family: var(--mono);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 32px 16px;
    }

    .card {
      width: 100%;
      max-width: 460px;

      background: #fff;

      border: 1px solid var(--line);
      border-radius: 2px;

      box-shadow: 0 1px 0 var(--line);
    }

    /* =========================================
       HEADER
       ========================================= */

    .header {
      padding: 28px 28px 20px;

      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      font-size: 11px;

      letter-spacing: 0.14em;
      text-transform: uppercase;

      color: var(--accent);

      margin: 0 0 8px;
    }

    h1 {
      font-family: var(--serif);

      font-size: 26px;
      font-weight: 400;

      margin: 0;

      letter-spacing: -0.01em;
    }

    .sub {
      font-size: 13px;

      color: #6b675f;

      margin: 8px 0 0;

      line-height: 1.5;
    }

    /* =========================================
       BODY
       ========================================= */

    .body {
      padding: 24px 28px 28px;
    }

    label {
      display: block;

      font-size: 11px;

      letter-spacing: 0.08em;
      text-transform: uppercase;

      color: #6b675f;

      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      min-width: 0;

      font-family: var(--mono);
      font-size: 14px;

      padding: 12px 14px;

      border: 1px solid var(--line);
      border-radius: 2px;

      background: var(--paper);
      color: var(--ink);

      outline: none;

      transition: border-color 0.15s ease;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    /* =========================================
       CONTROLES
       ========================================= */

    .row {
      display: flex;

      gap: 10px;

      margin-top: 14px;
    }

    select {
      min-width: 0;

      font-family: var(--mono);
      font-size: 13px;

      padding: 10px 12px;

      border: 1px solid var(--line);
      border-radius: 2px;

      background: var(--paper);
      color: var(--ink);
    }

    button {
      min-height: 42px;

      font-family: var(--mono);
      font-size: 13px;

      letter-spacing: 0.03em;

      padding: 10px 18px;

      border: none;
      border-radius: 2px;

      background: var(--accent);
      color: #fff;

      cursor: pointer;

      transition: background 0.15s ease;

      flex: 1;
    }

    button:hover {
      background: #244a40;
    }

    button:active {
      transform: translateY(1px);
    }

    .reset-btn {
      background: transparent;

      color: var(--accent);

      border: 1px solid var(--line);

      flex: 0 0 auto;
    }

    .reset-btn:hover {
      background: var(--accent-soft);
    }

    /* =========================================
       QR CODE
       ========================================= */

    .stage {
      margin-top: 24px;

      padding: 24px;

      background: var(--accent-soft);

      border: 1px dashed var(--line);
      border-radius: 2px;

      display: flex;
      flex-direction: column;

      align-items: center;

      gap: 14px;

      min-height: 260px;

      justify-content: center;

      overflow: hidden;
    }

    #qrcode {
      max-width: 100%;

      background: #fff;

      padding: 12px;

      line-height: 0;
    }

    #qrcode img,
    #qrcode canvas {
      display: block;

      max-width: 100%;

      height: auto;
    }

    .placeholder {
      font-size: 12px;

      color: #8a8578;

      text-align: center;

      max-width: 200px;

      line-height: 1.6;

      margin: 0;
    }

    .link-preview {
      font-size: 11px;

      color: #6b675f;

      word-break: break-word;
      overflow-wrap: anywhere;

      text-align: center;

      max-width: 280px;

      margin: 0;
    }

    /* =========================================
       DOWNLOAD
       ========================================= */

    .download-btn {
      display: none;

      margin-top: 14px;

      width: 100%;

      background: var(--ink);
    }

    .download-btn:hover {
      background: #000;
    }

    .download-btn.visible {
      display: block;
    }

    /* =========================================
       FOOTER
       ========================================= */

    .footer-note {
      margin-top: 16px;

      font-size: 11px;

      color: #a39d8e;

      text-align: center;

      line-height: 1.5;
    }


    /* =========================================
       TABLETTE
       ========================================= */

    @media (max-width: 600px) {

      body {
        padding: 20px 12px;

        align-items: flex-start;
      }

      .card {
        max-width: 100%;
      }

      .header {
        padding: 24px 20px 18px;
      }

      .body {
        padding: 20px;
      }

      h1 {
        font-size: 24px;
      }

      .stage {
        padding: 20px;
      }
    }


    /* =========================================
       MOBILE — SANS SCROLL
       ========================================= */

    @media (max-width: 480px) {

      html,
      body {
        width: 100%;

        height: 100%;
        min-height: 100%;

        overflow: hidden;
      }

      body {
        padding: 0;

        display: block;
      }

      .card {
        width: 100%;
        max-width: none;

        height: 100dvh;
        min-height: 0;

        border: none;
        border-radius: 0;

        box-shadow: none;

        display: flex;
        flex-direction: column;

        overflow: hidden;
      }

      /* HEADER */

      .header {
        flex: 0 0 auto;

        padding: 16px 18px 12px;
      }

      .eyebrow {
        font-size: 9px;

        margin-bottom: 5px;
      }

      h1 {
        font-size: 21px;

        line-height: 1.15;
      }

      .sub {
        font-size: 10px;

        line-height: 1.35;

        margin-top: 5px;
      }

      /* BODY */

      .body {
        flex: 1;

        min-height: 0;

        padding: 14px 18px 12px;

        display: flex;
        flex-direction: column;

        overflow: hidden;
      }

      label {
        font-size: 9px;

        margin-bottom: 5px;
      }

      input[type="text"] {
        width: 100%;

        height: 40px;

        padding: 8px 10px;

        font-size: 12px;

        flex-shrink: 0;
      }

      /* CONTROLES */

      .row {
        flex-direction: row;

        gap: 6px;

        margin-top: 8px;

        flex-shrink: 0;
      }

      select,
      .row button {
        min-height: 38px;
        height: 38px;

        padding: 6px 8px;

        font-size: 10px;
      }

      select {
        flex: 1.1;
      }

      .row #generateBtn {
        flex: 1;
      }

      .row .reset-btn {
        flex: 1;
      }

      /* STAGE */

      .stage {
        flex: 1;

        min-height: 0;

        width: 100%;

        margin-top: 12px;

        padding: 10px;

        gap: 8px;

        overflow: hidden;
      }

      /* QR CODE */

      #qrcode {
        width: min(100%, 240px);

        max-width: 240px;

        padding: 8px;

        flex-shrink: 1;
      }

      #qrcode canvas,
      #qrcode img {
        width: 100% !important;

        height: auto !important;

        display: block;
      }

      /* PLACEHOLDER */

      .placeholder {
        font-size: 10px;

        line-height: 1.4;

        max-width: 180px;

        margin: 0;
      }

      /* URL */

      .link-preview {
        font-size: 9px;

        line-height: 1.3;

        max-width: 95%;

        margin: 0;
      }

      /* DOWNLOAD */

      .download-btn {
        min-height: 36px;
        height: 36px;

        margin-top: 2px;

        padding: 6px 10px;

        font-size: 10px;

        flex-shrink: 0;
      }

      /* FOOTER */

      .footer-note {
        flex-shrink: 0;

        margin: 8px 0 0;

        font-size: 8px;

        line-height: 1.3;
      }
    }


    /* =========================================
       PETITS TÉLÉPHONES
       ========================================= */

    @media (max-width: 360px) {

      .header {
        padding: 12px 16px 10px;
      }

      h1 {
        font-size: 19px;
      }

      .sub {
        font-size: 9px;
      }

      .body {
        padding: 10px 16px 8px;
      }

      input[type="text"] {
        height: 36px;

        font-size: 11px;
      }

      .row {
        margin-top: 6px;
      }

      select,
      .row button {
        height: 35px;

        min-height: 35px;

        font-size: 9px;

        padding: 5px;
      }

      .stage {
        margin-top: 8px;

        padding: 8px;

        gap: 6px;
      }

      #qrcode {
        width: min(100%, 210px);

        max-width: 210px;

        padding: 6px;
      }

      .download-btn {
        height: 34px;

        min-height: 34px;

        font-size: 9px;
      }

      .footer-note {
        margin-top: 5px;

        font-size: 7px;
      }
    }
  </style>
</head>


<body>

  <div class="card">

    <!-- HEADER -->

    <div class="header">

      <p class="eyebrow">
        Outil rapide
      </p>

      <h1>
        Générateur de QR Code
      </h1>

      <p class="sub">
        Colle n'importe quel lien, génère un QR code,
        télécharge-le et envoie-le.
      </p>

    </div>


    <!-- BODY -->

    <div class="body">

      <label for="urlInput">
        Lien à encoder
      </label>

      <input
        type="text"
        id="urlInput"
        placeholder="https://exemple.com"
        autocomplete="off"
      >


      <!-- CONTROLES -->

      <div class="row">

        <select id="sizeSelect">

          <option value="200">
            Petit (200px)
          </option>

          <option value="300" selected>
            Moyen (300px)
          </option>

          <option value="400">
            Grand (400px)
          </option>

        </select>


        <button id="generateBtn">
          Générer
        </button>


        <button
          id="resetBtn"
          class="reset-btn"
        >
          Réinitialiser
        </button>

      </div>


      <!-- QR CODE -->

      <div class="stage">

        <div id="qrcode"></div>


        <p
          class="placeholder"
          id="placeholderText"
        >
          Ton QR code apparaîtra ici dès que tu
          auras collé un lien.
        </p>


        <p
          class="link-preview"
          id="linkPreview"
          style="display:none;"
        ></p>


        <button
          class="download-btn"
          id="downloadBtn"
        >
          Télécharger le QR code
        </button>

      </div>


      <!-- FOOTER -->

      <p class="footer-note">
        Tout se passe dans ton navigateur —
        aucun lien n'est envoyé ailleurs.
      </p>

    </div>

  </div>


  <script>

    const urlInput =
      document.getElementById('urlInput');

    const sizeSelect =
      document.getElementById('sizeSelect');

    const generateBtn =
      document.getElementById('generateBtn');

    const resetBtn =
      document.getElementById('resetBtn');

    const downloadBtn =
      document.getElementById('downloadBtn');

    const qrDiv =
      document.getElementById('qrcode');

    const placeholderText =
      document.getElementById('placeholderText');

    const linkPreview =
      document.getElementById('linkPreview');


    let qrInstance = null;


    /* =========================================
       NORMALISATION URL
       ========================================= */

    function normalizeUrl(value) {

      let v = value.trim();

      if (!v) {
        return '';
      }

      if (!/^https?:\/\//i.test(v)) {
        v = 'https://' + v;
      }

      return v;
    }


    /* =========================================
       GÉNÉRATION
       ========================================= */

    function generate() {

      const raw = urlInput.value;

      const url = normalizeUrl(raw);


      if (!url) {

        placeholderText.style.display = 'block';

        linkPreview.style.display = 'none';

        downloadBtn.classList.remove('visible');

        qrDiv.innerHTML = '';

        return;
      }


      const size =
        parseInt(sizeSelect.value, 10);


      qrDiv.innerHTML = '';


      qrInstance = new QRCode(qrDiv, {

        text: url,

        width: size,

        height: size,

        colorDark: '#1c1b1a',

        colorLight: '#ffffff',

        correctLevel:
          QRCode.CorrectLevel.H

      });


      placeholderText.style.display = 'none';

      linkPreview.style.display = 'block';

      linkPreview.textContent = url;

      downloadBtn.classList.add('visible');
    }


    generateBtn.addEventListener(
      'click',
      generate
    );


    /* =========================================
       ENTER
       ========================================= */

    urlInput.addEventListener(
      'keydown',
      (e) => {

        if (e.key === 'Enter') {
          generate();
        }

      }
    );


    /* =========================================
       RESET
       ========================================= */

    resetBtn.addEventListener(
      'click',
      () => {

        urlInput.value = '';

        sizeSelect.value = '300';

        qrDiv.innerHTML = '';

        qrInstance = null;

        placeholderText.style.display = 'block';

        linkPreview.style.display = 'none';

        downloadBtn.classList.remove('visible');

        urlInput.focus();

      }
    );


    /* =========================================
       TÉLÉCHARGEMENT
       AVEC MARGE BLANCHE
       ========================================= */

    downloadBtn.addEventListener(
      'click',
      () => {

        setTimeout(() => {

          const img =
            qrDiv.querySelector('img');

          const canvas =
            qrDiv.querySelector('canvas');


          let sourceCanvas;


          /*
           * QRCode.js peut générer un canvas
           * ou une image.
           */

          if (canvas) {

            sourceCanvas = canvas;

          } else if (img) {

            sourceCanvas =
              document.createElement('canvas');

            sourceCanvas.width =
              img.naturalWidth || img.width;

            sourceCanvas.height =
              img.naturalHeight || img.height;


            const ctx =
              sourceCanvas.getContext('2d');


            ctx.drawImage(
              img,
              0,
              0
            );

          } else {

            return;
          }


          /*
           * MARGE BLANCHE
           *
           * 40 pixels sur chaque côté.
           */

          const margin = 40;


          const finalCanvas =
            document.createElement('canvas');


          finalCanvas.width =
            sourceCanvas.width +
            margin * 2;

          finalCanvas.height =
            sourceCanvas.height +
            margin * 2;


          const ctx =
            finalCanvas.getContext('2d');


          /*
           * Fond blanc.
           */

          ctx.fillStyle = '#ffffff';


          ctx.fillRect(
            0,
            0,
            finalCanvas.width,
            finalCanvas.height
          );


          /*
           * QR code centré.
           */

          ctx.drawImage(
            sourceCanvas,

            margin,
            margin
          );


          /*
           * Téléchargement PNG.
           */

          const a =
            document.createElement('a');


          a.href =
            finalCanvas.toDataURL('image/png');


          a.download =
            'qrcode.png';


          document.body.appendChild(a);

          a.click();

          document.body.removeChild(a);

        }, 100);

      }
    );

  </script>

</body>
</html>
```
